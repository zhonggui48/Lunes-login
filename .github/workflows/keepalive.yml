name: Keep Alive

on:
  schedule:
    - cron: '0 0 1 * *'  # 每月1日执行一次
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Update timestamp
        run: |
          mkdir -p .github
          date > .github/keepalive.txt

      - name: Commit changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .github/keepalive.txt
          git commit -m "keepalive" || exit 0
          git push
